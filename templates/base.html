<!DOCTYPE html>

<html>
<head>

<title>AI Fall Detection System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#F1F5F9;
font-family:system-ui;
}

/* Sidebar */

.sidebar{
height:100vh;
width:230px;
position:fixed;
background:#0F172A;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:#CBD5F5;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#1E293B;
color:white;
}

/* Logout button highlight */

.logout-btn{
margin-top:30px;
background:#ef4444;
color:white !important;
border-radius:6px;
font-weight:500;
}

.logout-btn:hover{
background:#dc2626;
}

/* Main */

.main{
margin-left:240px;
padding:30px;
}

/* Cards */

.stat-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<div class="sidebar">

<h4>AI Monitor</h4>

<a href="/dashboard">Dashboard</a> <a href="/upload">Upload Video</a> <a href="/webcam">Live Cameras</a> <a href="/history">History</a> <a href="/analytics">Analytics</a> <a href="/admin">Admin</a>

<a href="/logout" class="logout-btn text-center m-3 p-2">
Logout
</a>

</div>

<div class="main">

{% block content %}{% endblock %}

</div>

<script>

/* FALL ALERT POPUP */

function showFallAlert(){

const alertBox=document.createElement("div");

alertBox.innerHTML=`
<div style="
position:fixed;
top:20px;
right:20px;
background:#ef4444;
color:white;
padding:15px 20px;
border-radius:10px;
box-shadow:0 6px 20px rgba(0,0,0,0.3);
font-weight:600;
z-index:9999;">
⚠ Fall Detected
</div>
`;

document.body.appendChild(alertBox);

setTimeout(()=>alertBox.remove(),4000);

}

</script>

</body>
</html>
