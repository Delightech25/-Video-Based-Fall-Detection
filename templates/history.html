{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Detection History</h2>

<div class="stat-card">

<table class="table">

<thead>
<tr>
<th>ID</th>
<th>User</th>
<th>Result</th>
<th>Timestamp</th>
<th>Confidence</th>
<th>Date</th>
</tr>
</thead>

<tbody>

{% for row in data %}

<tr>
<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>{{row[4]}}</td>
<td>{{row[5]}}</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
